<!doctype html><html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fududeeye Admin</title><style>body{font-family:Arial,sans-serif;background:#f4f7f5;margin:0;padding:20px;color:#183126}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 30px #0001}h1{color:#006b3c}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5ebe7;text-align:left;font-size:14px}.stats{display:flex;gap:12px}.stat{flex:1;background:#edf8f0;padding:16px;border-radius:14px}.num{font-size:28px;font-weight:800;color:#006b3c}</style></head><body><div class="wrap"><h1>Fududeeye Online — Admin</h1><div class="stats"><div class="stat">Customers<div id="total" class="num">—</div></div><div class="stat">Verified<div id="verified" class="num">—</div></div></div><div class="card"><h2>Customers</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>DOB</th><th>Gender</th><th>City</th><th>Verified</th><th>Created</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>async function load(){const s=await fetch('/api/admin/stats');if(!s.ok)return;const st=await s.json();total.textContent=st.total;verified.textContent=st.verified;const r=await fetch('/api/admin/customers');const d=await r.json();rows.innerHTML=d.customers.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>+252${x.phone}</td><td>${x.dob}</td><td>${x.gender}</td><td>${x.city}</td><td>${x.phone_verified?'Yes':'No'}</td><td>${x.created_at}</td></tr>`).join('')}load()</script></body></html>

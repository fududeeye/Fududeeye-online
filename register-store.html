<!doctype html><html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diiwaangeli Bakhaar — Fududeeye Online</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#eff9f3;color:#18231d}.card{max-width:720px;margin:25px auto;background:#fff;padding:24px;border-radius:24px;box-shadow:0 15px 40px #0a5c3418}h1{color:#087a40}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8e5dc;border-radius:12px;font-size:15px}input[type=file]{padding:10px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#087f40;color:#fff;font-weight:800;margin-top:16px}small{display:block;color:#63736a;margin-top:5px}.ok{color:#087f40;font-weight:700}.err{color:#b42318;font-weight:700}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{margin:10px;padding:18px}}</style></head><body><main class="card"><h1>🏪 Diiwaangeli Bakhaar</h1><p>Buuxi xogta mulkiilaha iyo bakhaarka. Codsiga waxaa dib u eegi doona maamulka.</p><p><a href="/" style="color:#087f40;font-weight:700;text-decoration:none">← Ku noqo Gelitaanka</a></p><form id="f">
<div class="grid"><div><label>Magaca mulkiilaha</label><input id="name" maxlength="100" required></div><div><label>Gender-ka</label><select id="gender" required><option value="">Dooro</option><option>Nin</option><option>Dumar</option></select></div></div>
<label>Lambarka mulkiilaha</label><input id="phone" inputmode="numeric" maxlength="12" placeholder="63xxxxxxx" required><label>Password</label><input id="pass" type="password" minlength="6" autocomplete="new-password" required>
<label>Magaca bakhaarka</label><input id="store" maxlength="120" required>
<div class="grid"><div><label>Nooca bakhaarka</label><select id="type" required><option value="">Dooro</option><option>Raashin / Grocery</option><option>Khudaar iyo miro</option><option>Hilib</option><option>Cabitaanno</option><option>Farmashiye</option><option>Qalab guri</option><option>Bakhaar kale</option></select></div><div><label>Baaxadda bakhaarka</label><select id="storeSize" required><option value="">Dooro</option><option>Bakhaar weyn</option><option>Bakhaar yar</option></select></div></div>
<label>Waxa lagu iibiyo</label><input id="products" maxlength="500" placeholder="Bariis, baasto, saliid..." required><div class="grid"><div><label>Magaalada</label><input id="city" required></div><div><label>Xaafadda</label><input id="neigh" required></div></div>
<label>Cinwaanka / meesha</label><textarea id="address" maxlength="500" required></textarea><div class="grid"><div><label>Saacadaha shaqada</label><input id="hours" maxlength="100" placeholder="8 AM - 10 PM"></div><div><label>Delivery</label><select id="delivery"><option value="0">Maya</option><option value="1">Haa</option></select></div></div>
<label>Lambarka ku iibsada meherada</label><input id="businessBuyerPhone" inputmode="numeric" maxlength="6" required><label>Sharaxaad <small>Ikhtiyaari</small></label><textarea id="desc" maxlength="1000" placeholder="Wax ka qor bakhaarka..."></textarea>
<label>Sawirka mulkiilaha <small>Ikhtiyaari</small></label><input type="file" id="ownerPhoto" accept="image/jpeg,image/png,image/webp" capture="user"><label>Kaadhka aqoonsiga ama Passport-ka <small>Ikhtiyaari</small></label><input type="file" id="idOrPassportPhoto" accept="image/jpeg,image/png,image/webp" capture="environment">
<button type="button" id="gps">📍 Qaado Location GPS</button><p id="msg"></p><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="agree" required style="width:auto"> Waxaan xaqiijinayaa in xogta aan bixiyay ay sax tahay.</label><button type="submit">🏪 Dir Codsiga</button></form></main>
<script>const API=location.origin;let lat=null,lng=null;const $=id=>document.getElementById(id);$('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;$('msg').className='ok';$('msg').textContent='✓ Location waa la helay'},()=>{$('msg').className='err';$('msg').textContent='Location lama helin. Waxaad gacanta ku qori kartaa cinwaanka.'});function readImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(file.size>900000)return reject(new Error('Sawir kasta waa inuu ka yaraadaa 900KB.'));const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1400;const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',0.78))};img.onerror=()=>reject(new Error('Sawirka lama akhriyi karin.'));img.src=r.result};r.onerror=()=>reject(new Error('Sawirka lama akhriyi karin.'));r.readAsDataURL(file)})}$('f').onsubmit=async e=>{e.preventDefault();if(!$('f').checkValidity()){$('f').reportValidity();return}$('msg').className='';$('msg').textContent='Dirista...';const submitBtn=$('f').querySelector('button[type=submit]');submitBtn.disabled=true;submitBtn.textContent='⏳ Waa la dirayaa...';try{const [ownerPhoto,idOrPassportPhoto]=await Promise.all([readImage($('ownerPhoto').files[0]),readImage($('idOrPassportPhoto').files[0])]);const body={name:$('name').value.trim(),phone:$('phone').value,password:$('pass').value,storeName:$('store').value.trim(),ownerGender:$('gender').value,businessType:$('type').value,storeSize:$('storeSize').value,productsSold:$('products').value.trim(),city:$('city').value.trim(),neighborhood:$('neigh').value.trim(),address:$('address').value.trim(),openingHours:$('hours').value.trim(),deliveryAvailable:$('delivery').value==='1',businessBuyerPhone:$('businessBuyerPhone').value,description:$('desc').value.trim(),ownerPhoto,idOrPassportPhoto,lat,lng};const r=await fetch(API+'/api/register/seller',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Qalad');$('msg').className='ok';$('msg').textContent=d.message||'Codsiga waa la diray.';$('f').reset();lat=lng=null}catch(e){$('msg').className='err';$('msg').textContent=e.message}finally{submitBtn.disabled=false;submitBtn.textContent='🏪 Dir Codsiga'}}</script></body></html>
